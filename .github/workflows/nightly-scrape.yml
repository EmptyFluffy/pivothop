name: nightly-scrape

# The nightly bot, laptop-independent (docs/23 Phase B). Scrapes, runs every gate,
# and only on green commits the regenerated data + pushes — which Vercel deploys.
# schedule + manual only, so its own push never re-triggers it (no loop).
on:
  schedule:
    - cron: '0 8 * * *'        # 08:00 UTC = 02:00 America/Costa_Rica (overnight local)
  workflow_dispatch: {}         # manual "Run workflow" button, for testing

# allow the job to push the data commit back to main
permissions:
  contents: write

concurrency:
  group: nightly-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Cold-cache runs are long (every board fetch hits the network at polite
    # spacing); warm runs are ~20-30 min. The first 50-min cap cancelled a cold
    # run mid-ingest, and the 150-min cap cancelled 2026-08-19 at exactly 2h30m.
    # The direct fleet is growing ~20-50 studios/night now, so headroom again.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Persist the scraper's accumulated state: the RAW CORPUS (postings
      # accumulate across nights exactly like the local pipeline — without it a
      # runner rebuilds from one night's fetch and boards flap below their data
      # floors), the first-seen ledger (posting ages survive reposts), and the
      # logo-tried cache (failed favicon lookups aren't re-hammered).
      - uses: actions/cache@v4
        with:
          path: |
            apps/scraper/data/postings_raw.ndjson
            apps/scraper/data/first-seen.json
            apps/scraper/data/logo-tried.json
            apps/scraper/data/adjacency.json
          key: scraper-state-${{ github.run_id }}
          restore-keys: |
            scraper-state-

      # Persist the polite HTTP cache too (20h TTL, matches the nightly cadence).
      # This is what keeps runs short AND inside the free Actions tier: warm runs
      # only re-fetch entries that expired since yesterday.
      - uses: actions/cache@v4
        with:
          path: apps/scraper/cache
          key: scraper-http-${{ github.run_id }}
          restore-keys: |
            scraper-http-

      - run: npm ci

      # The `direct` source RENDERS studio careers pages — their listings are
      # loaded by JavaScript and are absent from raw HTML. npm ci installs the
      # playwright package but not its browser binary, so without this step
      # Chromium cannot launch, the adapter falls back to static fetch (logging
      # NOT RENDERED), and every JS-loaded opening is missed. Chromium only:
      # the other browsers are ~400MB of runner time we never use.
      - name: Install Chromium for the direct-careers renderer
        run: npx playwright install --with-deps chromium

      - name: Scrape, gate, publish
        env:
          # normalize holds the parsed 150k-row corpus in memory; the runner's
          # default Node heap OOM'd on it. Give it real headroom.
          NODE_OPTIONS: --max-old-space-size=8192
          # gh release download needs a token on a PRIVATE repo — without it the
          # cold-cache corpus restore in ci-run.sh fails silently and the run
          # proceeds on an empty corpus, which is the failure mode it exists to
          # prevent. The default GITHUB_TOKEN can read this repo's releases.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          REED_API_KEY: ${{ secrets.REED_API_KEY }}
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Gates the `direct` source (studio careers pages read via Claude
          # extraction). Absent, that source logs loudly and reads nothing.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # CR aggregator APIs (2026-08-22): both sources skip silently until
          # the secrets exist — sign up at careerjet.com/partners and
          # jooble.org/api/about, then add the repo secrets.
          CAREERJET_API_KEY: ${{ secrets.CAREERJET_API_KEY }}
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
        run: bash apps/scraper/scripts/ci-run.sh

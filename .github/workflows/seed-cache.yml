name: seed-cache

# One-time helper: loads the warmed scraper HTTP cache (uploaded as the
# `cache-seed` release asset) into the Actions cache, so nightly-scrape runs
# warm from its first night instead of paying a multi-hour cold crawl.
# Safe to delete this file and the release once a nightly run has gone green.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download and unpack the seeds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download cache-seed --repo "$GITHUB_REPOSITORY" --pattern 'scraper-cache.tar.zst' --dir /tmp
          mkdir -p apps/scraper/cache apps/scraper/data
          tar --zstd -xf /tmp/scraper-cache.tar.zst -C apps/scraper/cache
          echo "http-cache entries: $(ls apps/scraper/cache | wc -l)"
          gh release download cache-seed --repo "$GITHUB_REPOSITORY" --pattern 'scraper-state.tar.zst' --dir /tmp
          tar --zstd -xf /tmp/scraper-state.tar.zst -C apps/scraper/data
          echo "state files: $(ls apps/scraper/data)"

      - uses: actions/cache/save@v4
        with:
          path: apps/scraper/cache
          key: scraper-http-seed-${{ github.run_id }}

      - uses: actions/cache/save@v4
        with:
          path: |
            apps/scraper/data/postings_raw.ndjson
            apps/scraper/data/first-seen.json
            apps/scraper/data/logo-tried.json
          key: scraper-state-seed-${{ github.run_id }}
